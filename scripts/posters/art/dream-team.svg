    <g transform="translate(312 304)"><path d="M0-30v-12"/><circle cy="-46" r="6" fill="#ff9fb7"/><circle r="30" fill="#ff9fb7"/><circle cx="-10" cy="-4" r="4" fill="#1e3f8a" stroke="none"/><circle cx="10" cy="-4" r="4" fill="#1e3f8a" stroke="none"/><path d="M-9 9q9 8 18 0" fill="none"/></g>
    <g transform="translate(196 370)"><path d="M0-30v-12"/><circle cy="-46" r="6" fill="#8fe0c0"/><circle r="30" fill="#8fe0c0"/><circle cx="-10" cy="-4" r="4" fill="#1e3f8a" stroke="none"/><circle cx="10" cy="-4" r="4" fill="#1e3f8a" stroke="none"/><path d="M-9 9q9 8 18 0" fill="none"/></g>
    <g transform="translate(206 450)"><path d="M0-30v-12"/><circle cy="-46" r="6" fill="#c6b2ff"/><circle r="30" fill="#c6b2ff"/><circle cx="-10" cy="-4" r="4" fill="#1e3f8a" stroke="none"/><circle cx="10" cy="-4" r="4" fill="#1e3f8a" stroke="none"/><path d="M-9 9q9 8 18 0" fill="none"/></g>
  </g>
