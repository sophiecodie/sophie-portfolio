<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 520 680">
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;800&amp;family=Caveat:wght@700&amp;display=block");</style></defs>
  <!-- Dream Team: a report travels past four friendly agents to a booked specialist -->
  <rect width="520" height="680" fill="#dce9ff"/>
  <circle cx="430" cy="90" r="46" fill="#ffe08a"/>
  <g fill="#fff" opacity=".9"><ellipse cx="110" cy="40" rx="60" ry="18"/><ellipse cx="150" cy="30" rx="38" ry="20"/><ellipse cx="420" cy="300" rx="52" ry="15"/><ellipse cx="452" cy="290" rx="30" ry="16"/></g>
  <!-- the report -->
